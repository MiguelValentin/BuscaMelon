<!DOCTYPE html>
<html>
<head>
    <title>Juego 3D</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #gameOver {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 40px;
            font-family: Arial;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="gameOver">
        ¡Game Over!<br>
        <button onclick="location.reload()">Reiniciar</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, player;
        let obstacles = [];
        let score = 0;
        let gameOver = false;
        
        // Configuración inicial
        function init() {
            // Escena
            scene = new THREE.Scene();
            
            // Cámara
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 20);
            camera.lookAt(0, 0, 0);
            
            // Renderer
            renderer = new THREE.WebGLRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            
            // Luz
            const light = new THREE.PointLight(0xffffff, 1, 100);
            light.position.set(0, 10, 10);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x404040));
            
            // Jugador
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshPhongMaterial({ color: 0x00ff00 });
            player = new THREE.Mesh(geometry, material);
            player.position.y = 0.5;
            scene.add(player);
            
            // Suelo
            const groundGeometry = new THREE.PlaneGeometry(20, 20);
            const groundMaterial = new THREE.MeshPhongMaterial({ color: 0xcccccc });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);
            
            // Eventos
            window.addEventListener('resize', onWindowResize, false);
            document.addEventListener('keydown', onKeyDown);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function onKeyDown(event) {
            if(gameOver) return;
            
            const speed = 1.5;
            switch(event.key) {
                case 'ArrowLeft':
                    player.position.x = Math.max(-8, player.position.x - speed);
                    break;
                case 'ArrowRight':
                    player.position.x = Math.min(8, player.position.x + speed);
                    break;
                case 'ArrowUp':
                    player.position.z = Math.max(-8, player.position.z - speed);
                    break;
                case 'ArrowDown':
                    player.position.z = Math.min(8, player.position.z + speed);
                    break;
            }
        }
        
        function createObstacle() {
            const geometry = new THREE.SphereGeometry(0.5);
            const material = new THREE.MeshPhongMaterial({ color: 0xff0000 });
            const obstacle = new THREE.Mesh(geometry, material);
            
            obstacle.position.x = (Math.random() - 0.5) * 16;
            obstacle.position.y = 10;
            obstacle.position.z = (Math.random() - 0.5) * 16;
            
            scene.add(obstacle);
            obstacles.push(obstacle);
        }
        
        function checkCollision() {
            return obstacles.some(obstacle => {
                const distance = player.position.distanceTo(obstacle.position);
                return distance < 1;
            });
        }
        
        function update() {
            if(gameOver) return;
            
            // Mover obstáculos
            obstacles.forEach(obstacle => {
                obstacle.position.y -= 0.15;
                
                // Eliminar obstáculos que tocan el suelo
                if(obstacle.position.y < -0.5) {
                    scene.remove(obstacle);
                    obstacles = obstacles.filter(o => o !== obstacle);
                    score++;
                }
            });
            
            // Crear nuevos obstáculos
            if(Math.random() < 0.03) {
                createObstacle();
            }
            
            // Verificar colisiones
            if(checkCollision()) {
                gameOver = true;
                document.getElementById('gameOver').style.display = 'block';
            }
        }
        
        // Bucle de animación
        function animate() {
            requestAnimationFrame(animate);
            update();
            renderer.render(scene, camera);
        }
        
        // Iniciar juego
        init();
        animate();
    </script>
</body>
</html>
